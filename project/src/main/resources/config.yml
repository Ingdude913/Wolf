# Werewolf Plugin Configuration

# Minimum players required to start a game
min-players: 4

# Day phase duration in seconds
day-duration: 120

# Night phase duration in seconds
night-duration: 60

# Ability cooldowns in seconds (for reusable abilities)
transform-cooldown: 10
ninja-cooldown: 15

# Lobby (waiting) duration in seconds after minimum players reached
lobby-duration: 30

# Whether to use the world's natural day/night cycle (false = force time)
use-natural-time: false

# Messages prefix
prefix: "&8[&cWerewolf&8] &r"

# Role distribution weights (higher = more likely)
role-weights:
  werewolf: 1
  villager: 3
  witch: 1
  seer: 1
  hunter: 1
  trickster: 1
  ninja: 1

# Items
items:
  vote-sword:
    material: STONE_SWORD
    name: "&c&lVote Sword &7(Left-click a player to vote)"
  revoke-vote:
    material: PAPER
    name: "&e&lRevoke Vote &7(Right-click to revoke your vote)"
  seer-book:
    material: BOOK
    name: "&9&lSeer's Book &7(Right-click to check a player)"
  witch-poison:
    material: POTION
    name: "&5&lPoison &7(Right-click a player to kill them)"
  witch-heal:
    material: POTION
    name: "&a&lHeal &7(Right-click a player to heal them)"
  hunter-target:
    material: COMPASS
    name: "&6&lHunter's Compass &7(Right-click a player to select your target)"
  werewolf-axe:
    material: NETHERITE_AXE
    name: "&4&lWerewolf Axe &7(Left-click to kill)"
  werewolf-armor:
    material: NETHERITE_CHESTPLATE
    name: "&4&lWerewolf Armor &7(Right-click to transform)"
  skip-day:
    material: CLOCK
    name: "&b&lSkip Time &7(Right-click to skip 1/3 of remaining time)"
  role-info-book:
    material: WRITTEN_BOOK
    name: "&6&lYour Role &7(Right-click to read)"
  setup-info:
    material: PAPER
    name: "&e&lGame Setup &7(Right-click to view setup)"
  wolf-team:
    material: RED_WOOL
    name: "&4&lWolf Team &7(Right-click to see teammates)"
  ninja-book:
    material: ENCHANTED_BOOK
    name: "&5&lNinja Book &7(Right-click to select an ability)"
  ninja-ability:
    material: ENDER_EYE
    name: "&5&lNinja Orb &7(Right-click to activate your selected ability)"
